<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="530" viewBox="0 0 660 530">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .grp-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; rx: 4; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .input-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 3; }
      .input-hi { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.3; rx: 3; }
      .btn-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1; rx: 4; }
      .btn-pri { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 4; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="530" fill="#F8FAFC" rx="10" />

  <g transform="translate(26, 20)" filter="url(#winShadow)">
    <rect x="0" y="0" width="608" height="438" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 0 6 Q 0 0 6 0 L 602 0 Q 608 0 608 6 L 608 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信ポートのプロパティ — [LXI Event] タブ</text>

    <path d="M 14 62 L 14 42 Q 14 38 18 38 L 108 38 Q 112 38 112 42 L 112 62 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="63" y="53" class="ui" font-size="11.5" fill="#475569" text-anchor="middle">コマンド集</text>
    <path d="M 114 62 L 114 40 Q 114 36 118 36 L 236 36 Q 240 36 240 40 L 240 62 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="177" y="53" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">LXI Event</text>

    <rect x="14" y="61" width="580" height="328" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="115" y1="61" x2="239" y2="61" stroke="#FFFFFF" stroke-width="2" />

    <!-- GroupBox 1: LXI Event 通信方式設定 -->
    <rect x="28" y="76" width="552" height="106" class="grp-box" />
    <rect x="38" y="68" width="290" height="16" fill="#FFFFFF" />
    <text x="42" y="80" class="grp-lbl">LXI Event Messaging 通信設定（UDP / TCP）</text>

    <text x="42" y="108" class="ui" font-size="11" fill="#334155">通信方式:</text>
    <rect x="158" y="92" width="214" height="24" class="input-hi" />
    <text x="168" y="108" class="mono" font-size="11.5" font-weight="700" fill="#1E3A8A">UDP マルチキャスト ▼</text>
    <text x="382" y="108" class="ui" font-size="10.2" fill="#64748B">(UDP マルチキャスト / TCP)</text>

    <text x="42" y="146" class="ui" font-size="11" fill="#334155">アドレス / ポート:</text>
    <rect x="158" y="130" width="144" height="24" class="input-box" />
    <text x="168" y="146" class="mono" font-size="11.5" fill="#0F172A">224.0.23.159</text>
    <rect x="310" y="130" width="76" height="24" class="input-box" />
    <text x="320" y="146" class="mono" font-size="11.5" fill="#0F172A">5044</text>
    <rect x="394" y="130" width="172" height="24" class="btn-box" />
    <text x="480" y="146" class="ui" font-size="10.2" font-weight="600" fill="#1E293B" text-anchor="middle">LXI 標準値 (224.0.23.159:5044)</text>

    <text x="42" y="174" class="ui" font-size="10" fill="#475569">パケット形式: LXI 標準イベントフレーム (Magic "LXI" + Domain + EventID 16B + Seq + Timestamp)</text>

    <!-- GroupBox 2: ドメイン・イベント待機設定 -->
    <rect x="28" y="192" width="552" height="84" class="grp-box" />
    <rect x="38" y="184" width="254" height="16" fill="#FFFFFF" />
    <text x="42" y="196" class="grp-lbl">LXI ドメイン・EventID・タイムアウト設定</text>

    <text x="42" y="224" class="ui" font-size="11" fill="#334155">LXI ドメイン番号:</text>
    <rect x="158" y="208" width="74" height="24" class="input-box" />
    <text x="168" y="224" class="mono" font-size="11.5" fill="#0F172A">0</text>
    <text x="240" y="224" class="ui" font-size="10" fill="#64748B">(0〜255)</text>

    <text x="304" y="224" class="ui" font-size="11" fill="#334155">既定 EventID:</text>
    <rect x="386" y="208" width="180" height="24" class="input-box" />
    <text x="396" y="224" class="mono" font-size="11.5" fill="#0F172A">LAN0 (LAN0〜LAN7/任意)</text>

    <text x="42" y="260" class="ui" font-size="11" fill="#334155">待機タイムアウト(ms):</text>
    <rect x="158" y="244" width="110" height="24" class="input-box" />
    <text x="168" y="260" class="mono" font-size="11.5" fill="#0F172A">10000</text>
    <rect x="288" y="249" width="14" height="14" rx="2" fill="#2563EB" />
    <path d="M 291 256 L 294 259 L 299 252" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <text x="308" y="260" class="ui" font-size="10.8" fill="#1E293B">自局送出イベントのループバック受信を除外</text>

    <!-- GroupBox 3: LXI Event Logs 取得設定 -->
    <rect x="28" y="286" width="552" height="92" class="grp-box" />
    <rect x="38" y="278" width="234" height="16" fill="#FFFFFF" />
    <text x="42" y="290" class="grp-lbl">LXI Event Logs 取得・テスト送出</text>

    <text x="42" y="318" class="ui" font-size="11" fill="#334155">ログ取得対象 IP:</text>
    <rect x="158" y="302" width="174" height="24" class="input-box" />
    <text x="168" y="318" class="mono" font-size="11.5" fill="#0F172A">192.168.1.50</text>
    <rect x="340" y="302" width="110" height="24" class="btn-box" />
    <text x="395" y="318" class="ui" font-size="10.2" font-weight="600" fill="#1E293B" text-anchor="middle">Event Log 取得</text>
    <rect x="456" y="302" width="110" height="24" class="btn-pri" />
    <text x="511" y="318" class="ui" font-size="10.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">テストイベント送出</text>

    <rect x="42" y="336" width="524" height="32" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="52" y="356" class="mono" font-size="10.3" fill="#1E3A8A">EventLog URL: http://192.168.1.50/lxi/eventlog  |  Listener: UDP 224.0.23.159:5044</text>

    <rect x="200" y="398" width="96" height="30" class="btn-pri" />
    <text x="248" y="417" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OK</text>
    <rect x="312" y="398" width="96" height="30" class="btn-box" />
    <text x="360" y="417" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">キャンセル</text>
  </g>

  <rect x="26" y="470" width="608" height="44" class="callout-box" />
  <text x="42" y="489" class="ui" font-size="11" font-weight="700" fill="#92400E">メイン画面の［通信モード(M)］で「LXI_EVENT」選択時に自動表示</text>
  <text x="42" y="506" class="ui" font-size="10.5" fill="#451A03">・ハードウェアのトリガ配線なしで、LAN マルチキャスト経由の複数機器同期トリガおよびログ収集を行えます。</text>
</svg>
