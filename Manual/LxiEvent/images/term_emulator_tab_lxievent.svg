  <rect x="0" y="0" width="880" height="510" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">[LXI Event] LAN Event &amp; Event Logs 仮想スレーブタブ画面（TermAnalysis.LxiEvent.dll 内蔵）</text>

  <rect x="616" y="9" width="240" height="22" rx="11" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
  <text x="736" y="24" class="ui" font-size="10.2" font-weight="700" fill="#1D4ED8" text-anchor="middle">✓ TermAddIn_LxiEvent.License 共用</text>

